<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">VaultAI document workflow</title>
  <desc id="description">A confidential PDF is indexed locally, then a user question is routed through document selection, evidence retrieval, an evidence sufficiency check, and local grounded answer generation. Unsupported questions receive an abstention.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52708e"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#17845d"/></marker>
    <style>
      text { font-family: Aptos, Inter, Arial, sans-serif; fill: #172b42; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2px; fill: #17845d; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #597087; }
      .section { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; fill: #60758b; }
      .card-title { font-size: 20px; font-weight: 700; }
      .card-copy { font-size: 16px; fill: #587087; }
      .small { font-size: 14px; fill: #60758b; }
      .connector { fill: none; stroke: #52708e; stroke-width: 3; marker-end: url(#arrow); }
      .connector-green { fill: none; stroke: #17845d; stroke-width: 3; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f4f7fa"/>
  <text x="64" y="52" class="eyebrow">SMART INDIA HACKATHON 2026  ·  PS 26117  ·  MRPL</text>
  <text x="64" y="101" class="title">Confidential PDF to evidence-backed answer</text>
  <text x="64" y="134" class="subtitle">VaultAI keeps the document, retrieval and model response inside the local environment.</text>

  <rect x="48" y="160" width="1504" height="690" rx="24" fill="#ffffff" stroke="#cfdae5" stroke-width="2"/>
  <rect x="76" y="179" width="345" height="30" rx="15" fill="#e7f5ee"/>
  <text x="94" y="200" class="small" style="font-weight:700; fill:#177451; letter-spacing:1px">LOCAL / ON-PREMISES WORKFLOW</text>

  <text x="88" y="241" class="section">1  ·  INDEX A DOCUMENT ONCE</text>
  <g>
    <rect x="88" y="258" width="320" height="100" rx="16" fill="#f7fafc" stroke="#cbd8e5" stroke-width="2"/>
    <circle cx="119" cy="292" r="16" fill="#e7f5ee"/><text x="119" y="298" text-anchor="middle" class="small" style="font-weight:700; fill:#177451">1</text>
    <text x="147" y="293" class="card-title">Upload PDF</text>
    <text x="112" y="330" class="card-copy">Engineering reports, manuals, SOPs</text>

    <rect x="458" y="258" width="320" height="100" rx="16" fill="#f7fafc" stroke="#cbd8e5" stroke-width="2"/>
    <circle cx="489" cy="292" r="16" fill="#e7f5ee"/><text x="489" y="298" text-anchor="middle" class="small" style="font-weight:700; fill:#177451">2</text>
    <text x="517" y="293" class="card-title">Validate &amp; store locally</text>
    <text x="482" y="330" class="card-copy">PDF and metadata stay on-prem</text>

    <rect x="828" y="258" width="320" height="100" rx="16" fill="#f7fafc" stroke="#cbd8e5" stroke-width="2"/>
    <circle cx="859" cy="292" r="16" fill="#e7f5ee"/><text x="859" y="298" text-anchor="middle" class="small" style="font-weight:700; fill:#177451">3</text>
    <text x="887" y="293" class="card-title">Extract text &amp; chunk</text>
    <text x="852" y="330" class="card-copy">Prepare searchable passages</text>

    <rect x="1198" y="258" width="320" height="100" rx="16" fill="#eef5fb" stroke="#b8cde0" stroke-width="2"/>
    <circle cx="1229" cy="292" r="16" fill="#dceaf6"/><text x="1229" y="298" text-anchor="middle" class="small" style="font-weight:700; fill:#315e86">4</text>
    <text x="1257" y="293" class="card-title">Embed &amp; index</text>
    <text x="1222" y="330" class="card-copy">MiniLM vectors in ChromaDB</text>
  </g>
  <path d="M410 308 H447" class="connector"/>
  <path d="M780 308 H817" class="connector"/>
  <path d="M1150 308 H1187" class="connector"/>

  <line x1="88" y1="391" x2="1518" y2="391" stroke="#e4ebf1" stroke-width="2"/>
  <text x="88" y="430" class="section">2  ·  ANSWER A QUESTION</text>

  <path d="M303 529 H340" class="connector"/>
  <path d="M555 529 H592" class="connector"/>
  <path d="M858 529 H895" class="connector"/>
  <path d="M1110 529 H1147" class="connector-green"/>
  <path d="M1365 529 H1392" class="connector-green"/>

  <g>
    <rect x="82" y="466" width="220" height="126" rx="18" fill="#f7fafc" stroke="#cbd8e5" stroke-width="2"/>
    <text x="192" y="510" text-anchor="middle" class="card-title">Ask a question</text>
    <text x="192" y="544" text-anchor="middle" class="card-copy">About internal documents</text>

    <rect x="342" y="466" width="212" height="126" rx="18" fill="#eef5fb" stroke="#b8cde0" stroke-width="2"/>
    <text x="448" y="510" text-anchor="middle" class="card-title">LangGraph router</text>
    <text x="448" y="544" text-anchor="middle" class="card-copy">Selects the right agent</text>

    <rect x="594" y="466" width="262" height="126" rx="18" fill="#eef5fb" stroke="#b8cde0" stroke-width="2"/>
    <text x="725" y="510" text-anchor="middle" class="card-title">Document agent</text>
    <text x="725" y="544" text-anchor="middle" class="card-copy">Select docs · retrieve top 5</text>
    <text x="725" y="567" text-anchor="middle" class="small">from the local index</text>

    <polygon points="1002,449 1110,529 1002,609 894,529" fill="#fff7e7" stroke="#dbad50" stroke-width="2"/>
    <text x="1002" y="516" text-anchor="middle" class="card-title" style="font-size:17px">Enough</text>
    <text x="1002" y="540" text-anchor="middle" class="card-title" style="font-size:17px">evidence?</text>

    <rect x="1149" y="466" width="216" height="126" rx="18" fill="#e8f5ee" stroke="#9dcdb5" stroke-width="2"/>
    <text x="1257" y="510" text-anchor="middle" class="card-title">Grounded answer</text>
    <text x="1257" y="544" text-anchor="middle" class="card-copy">Local Qwen3.5</text>
    <text x="1257" y="567" text-anchor="middle" class="small">with source evidence</text>

    <rect x="1394" y="466" width="124" height="126" rx="18" fill="#f1f7f4" stroke="#b8d6c7" stroke-width="2"/>
    <text x="1456" y="510" text-anchor="middle" class="card-title" style="font-size:18px">Show</text>
    <text x="1456" y="536" text-anchor="middle" class="card-title" style="font-size:18px">answer +</text>
    <text x="1456" y="562" text-anchor="middle" class="card-title" style="font-size:18px">citations</text>
  </g>
  <text x="1121" y="511" class="small" style="font-weight:700; fill:#177451">YES</text>
  <path d="M1002 610 V655" fill="none" stroke="#bd8c2f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1015" y="638" class="small" style="font-weight:700; fill:#956b1b">NO</text>
  <rect x="850" y="668" width="304" height="62" rx="14" fill="#fff8e9" stroke="#e4c77e" stroke-width="2"/>
  <text x="1002" y="706" text-anchor="middle" class="card-copy" style="font-weight:700; fill:#77591d">Abstain: “Not enough information”</text>

  <line x1="88" y1="752" x2="1518" y2="752" stroke="#e4ebf1" stroke-width="2"/>
  <text x="88" y="792" class="small" style="font-weight:700; letter-spacing:.8px">OTHER ROUTES</text>
  <rect x="260" y="767" width="440" height="54" rx="14" fill="#f5f1fc" stroke="#d5c6ed" stroke-width="2"/>
  <text x="480" y="790" text-anchor="middle" class="card-copy" style="font-size:15px; font-weight:700; fill:#604b85">Code request to coding agent</text>
  <text x="480" y="809" text-anchor="middle" class="small">Docker sandbox · network disabled</text>
  <rect x="728" y="767" width="520" height="54" rx="14" fill="#fdf0f3" stroke="#e8c5cf" stroke-width="2"/>
  <text x="988" y="790" text-anchor="middle" class="card-copy" style="font-size:15px; font-weight:700; fill:#8d4d60">Image request to vision agent</text>
  <text x="988" y="809" text-anchor="middle" class="small">Local Qwen3-VL model</text>
  <text x="1517" y="801" text-anchor="end" class="small">Audit trail records key actions</text>
</svg>
